name: Build LaTeX PDFs

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REPORT_DIR: assignment_1
  SLIDES_DIR: assignment_1/slides

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile report
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ${{ env.REPORT_DIR }}
          root_file: main.tex

      - name: Compile slideshow
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ${{ env.SLIDES_DIR }}
          root_file: main.tex

      - name: Collect PDFs
        run: |
          mkdir -p artifacts
          cp "$REPORT_DIR/main.pdf" artifacts/report.pdf
          cp "$SLIDES_DIR/main.pdf" artifacts/slides.pdf

      - name: Upload PDFs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs
          path: artifacts/
          if-no-files-found: error

      - name: Name release assets after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp artifacts/report.pdf "$GITHUB_REF_NAME-report.pdf"
          cp artifacts/slides.pdf "$GITHUB_REF_NAME-slides.pdf"

      - name: Publish PDFs to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.ref_name }}-report.pdf
            ${{ github.ref_name }}-slides.pdf
          generate_release_notes: true
