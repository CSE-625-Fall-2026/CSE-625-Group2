name: Release LaTeX PDF

on:
  push:
    tags: ['v*']

env:
  DOC_DIR: assignment_1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ${{ env.DOC_DIR }}
          root_file: main.tex

      - name: Name the release asset after the tag
        run: cp "$DOC_DIR/main.pdf" "$GITHUB_REF_NAME.pdf"

      - name: Publish PDF to a release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.ref_name }}.pdf
          generate_release_notes: true
